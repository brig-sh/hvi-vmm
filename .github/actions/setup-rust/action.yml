name: Set up Rust
description: >-
  Install the committed Rust toolchain pin, add any extra target, restore the
  cargo cache, and optionally install a nightly rustfmt (for the comment-reflow
  check).

inputs:
  target:
    description: >-
      Extra rustup target to install, for the cross compile-check of a backend
      that has no runner (for example aarch64-unknown-linux-gnu). Empty
      installs nothing beyond the host target.
    required: false
    default: ""
  nightly:
    description: >-
      Install the nightly toolchain pinned in pins.env with rustfmt, needed by
      the comment-reflow step in tools/tidy.sh.
    required: false
    default: "false"
  cache-key:
    description: >-
      Extra discriminator for the cargo cache, so jobs that build for different
      targets do not share one entry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Installs the toolchain pinned by the in-tree rust-toolchain.toml together
    # with its components, so an unresolvable pin fails here rather than midway
    # through a later step. The argument-free form is the one that reads the pin.
    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Add the cross target
      if: inputs.target != ''
      shell: bash
      run: rustup target add "${{ inputs.target }}"

    - name: Install nightly rustfmt (comment reflow)
      if: inputs.nightly == 'true'
      shell: bash
      # pins.env sits at the repo root, this action's default directory.
      run: |
        . ./pins.env
        rustup toolchain install "$RUSTFMT_NIGHTLY" --profile minimal \
          --component rustfmt --no-self-update

    - name: Cache cargo build and installed binaries
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ inputs.cache-key }}
        # Do not cache ~/.cargo/bin. The self-hosted runners have real home
        # directories, and restoring one machine's copy over another's leaves
        # that home full of rustup shims pointing at a rustup binary the cache
        # did not bring with them. Every one of them then reports "command not
        # found", on a host where cargo is plainly installed, which is a long
        # way from the actual cause.
        cache-bin: "false"
