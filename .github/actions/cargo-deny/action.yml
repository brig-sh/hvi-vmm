name: cargo-deny
description: Install the pinned cargo-deny and check the dependency graph.

# One definition for the two lanes that audit dependencies: the per-change
# `check-deps` job and the weekly `audit-deps.yml` lane. Both must run the
# same tool at the same version against the same config, so the pin and the
# invocation live here rather than being copied into each.
#
# The version pin is an action *input*, which Renovate's github-actions
# manager does not read. `.github/renovate.json` carries a custom manager
# for the line below; keep the `# renovate:` marker if this moves.

runs:
  using: composite
  steps:
    - name: Install cargo-deny
      uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
      with:
        # renovate: datasource=crate depName=cargo-deny
        tool: cargo-deny@0.20.2
    - name: Check the dependency graph
      shell: bash
      # `cargo deny` runs through the rustup proxy, which resolves the
      # toolchain pinned in rust-toolchain.toml and installs it if absent.
      # This job needs no particular compiler, only `cargo metadata`, so
      # take whatever the runner image already has and skip that download.
      env:
        RUSTUP_TOOLCHAIN: stable
      run: cargo deny check
