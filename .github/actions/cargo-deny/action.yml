name: cargo-deny
description: Install the pinned cargo-deny and check the dependency graph.

# One definition for the two lanes that audit dependencies: the `check-deps`
# job and the weekly `audit-deps.yml` lane. Both must run the same tool, at
# the same version, against the same configuration, so the pin and the
# command live here instead of in each lane.
#
# The version pin is an action input, which the github-actions manager of
# Renovate does not read. `.github/renovate.json` holds a custom manager for
# the line below. Keep the `# renovate:` marker with it.

runs:
  using: composite
  steps:
    - name: Install cargo-deny
      uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
      with:
        # renovate: datasource=crate depName=cargo-deny
        tool: cargo-deny@0.20.2
    - name: Check the dependency graph
      shell: bash
      # `cargo deny` runs through the rustup proxy, which resolves the
      # toolchain that rust-toolchain.toml pins and installs it if it is
      # absent. This job needs `cargo metadata` and no particular compiler,
      # so use the toolchain in the runner image and skip that download.
      env:
        RUSTUP_TOOLCHAIN: stable
      run: cargo deny check
