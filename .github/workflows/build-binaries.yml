name: Build binaries

# Build the binaries a revision ships, one artifact per target, and leave them
# on the run for a publisher to hand out. Nothing here pushes anywhere. Every
# push to main builds the same set as a release, so what a release publishes is
# what the main lane has already built.
#
# The suites live in build-and-test.yml. This lane is the distributable build:
# static musl on Linux, and a signed binary on macOS.

on:
  workflow_call:
    # No input names a version. Every build derives one from the history it is
    # built in, so what a binary reports is evidence of the commit it came
    # from rather than a value passed in. A release builds at its tag, and the
    # derivation names the release.
    inputs:
      developer-id:
        description: >-
          Whether to sign the macOS binary with the organization's Developer ID
          and notarize it. A release passes true. Every other caller gets an
          ad-hoc signature, which carries the entitlement too, but Gatekeeper
          refuses it on a binary that was downloaded.
        type: boolean
        required: false
        default: false
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      NOTARY_KEY_P8:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

# The default shell runs `bash -e` without pipefail.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static musl, so a host whose glibc is older than the runner's can still
  # start the binary. The KVM backends are compiled in by target, so each
  # architecture is built on a runner of that architecture.
  linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, since a build derives its version from the last
          # release tag and how far past it the build is. A shallow checkout
          # carries no tags, so every build would report the commit alone.
          fetch-depth: 0

      # No cache for a release build. The cache is written by the main lane,
      # and what a release ships is built from the tag alone.
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          cache: ${{ !inputs.developer-id }}

      # --locked, so a stale Cargo.lock fails here by name rather than being
      # rewritten, reported as `dirty`, and refused later as a version that
      # does not match the release.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Assemble the artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dist=$RUNNER_TEMP/binaries
          mkdir -p "$dist"
          cp "target/$TARGET/release/hvi" "$dist/hvi"

          # A dynamically linked binary would have come from a musl target that
          # silently fell back, and it would fail on the hosts this build is
          # for rather than on this runner. Rust links the musl targets as a
          # static PIE, which `file` names differently from a plain static
          # link.
          file "$dist/hvi"
          file "$dist/hvi" | grep -qE "statically linked|static-pie linked" || {
            echo "::error::$TARGET did not produce a static binary"; exit 1; }

          "$dist/hvi" --version
          .github/scripts/write-manifest.sh "$dist" \
            component=binaries "target=$TARGET" \
            "version=$("$dist/hvi" --version | awk '{print $2}')" \
            signed:=false

      # Tarred rather than uploaded as a file: an artifact upload resets every
      # mode, and the binary has to come back out of it executable. Left
      # uncompressed, since the upload compresses what it is handed.
      - name: Pack the artifact
        env:
          TARGET: ${{ matrix.target }}
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/$TARGET.tar" binaries

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hvi-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 7

  # The macOS backend is Apple silicon only, so there is one target here.
  #
  # A Developer ID build runs on a runner labelled `notary`: signing needs the
  # certificate and notarization needs a route to Apple, and the other macOS
  # runners have neither. An ad-hoc build runs on the hosted image.
  macos:
    name: Build aarch64-apple-darwin
    runs-on: >-
      ${{ inputs.developer-id
          && fromJSON('["self-hosted", "macOS", "ARM64", "notary"]')
          || 'macos-15' }}
    # Below the keychain lock's stale age (keychain-lock.sh), which a job that
    # takes the lock must stay under.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache for a release build, as on Linux.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: aarch64-apple-darwin
          cache: ${{ !inputs.developer-id }}

      # The hosted image ships jq and a self-hosted Mac does not have to.
      - name: Install jq
        run: command -v jq >/dev/null || brew install jq

      # A notary Mac keeps one ~/.cargo for every job and repository that
      # runs on it, so a Developer ID build fetches its crates into a home of
      # its own rather than compiling whatever that registry holds.
      - name: Build
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
        run: |
          if [ "$DEVELOPER_ID" = true ]; then
            export CARGO_HOME=$RUNNER_TEMP/cargo-home
          fi
          cargo build --locked --release

      # Either signature carries the entitlement that lets the binary call
      # Hypervisor.framework. A release is downloaded, and Gatekeeper runs a
      # downloaded binary only when it is notarized, so a release takes the
      # Developer ID. A development build is signed ad-hoc.
      - name: Sign with the organization's Developer ID
        if: inputs.developer-id
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          .github/scripts/sign-macos.sh target/release/hvi hvi.entitlements

      - name: Sign ad-hoc
        if: ${{ !inputs.developer-id }}
        run: |
          codesign --sign - --entitlements hvi.entitlements --force \
            --options runtime target/release/hvi
          codesign -dv --entitlements - target/release/hvi 2>&1 |
            grep -qi hypervisor

      - name: Assemble the artifact
        run: |
          dist=$RUNNER_TEMP/binaries
          mkdir -p "$dist"
          cp target/release/hvi "$dist/hvi"

          # Copied after signing, and `cp` does not carry a signature across on
          # every filesystem, so the copy is verified rather than the original.
          codesign --verify --strict "$dist/hvi"

          # Read from the signature itself, so the release checks what the
          # binary carries rather than what this run was asked to do.
          # Captured before the match: under pipefail, `grep -q` leaving on the
          # first match kills codesign with SIGPIPE mid-output, and the
          # pipeline then reads as false on every signed binary.
          signed=false
          signature=$(codesign -dvv "$dist/hvi" 2>&1)
          if grep -q '^Authority=Developer ID Application:' <<<"$signature"; then
            signed=true
          fi

          "$dist/hvi" --version
          .github/scripts/write-manifest.sh "$dist" \
            component=binaries target=aarch64-apple-darwin \
            "version=$("$dist/hvi" --version | awk '{print $2}')" \
            "signed:=$signed"

      - name: Pack the artifact
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/aarch64-apple-darwin.tar" binaries

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hvi-aarch64-apple-darwin
          path: ${{ runner.temp }}/aarch64-apple-darwin.tar
          if-no-files-found: error
          retention-days: 7
