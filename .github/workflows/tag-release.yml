name: Release

# A pushed `v*` tag releases the commit it names:
#
#   check-tag  the tag's shape, that it is annotated and on main, that a build
#              there reports it, that it is not released yet; the notes; then a
#              passing main-build-and-publish.yml run of the commit
#   build      the binaries, rebuilt at the tag, since the version comes from
#              git and the main lane built the commit before the tag existed;
#              the macOS one signed with the Developer ID and notarized
#   verify     each manifest names the version and the tagged commit, and the
#              macOS binary carries the Developer ID
#   draft      the draft release: archives, SHA256SUMS, its signature
#   publish    the binaries to GHCR as <target>-vX.Y.Z
#   release    the draft made public
#
# Draft, then GHCR, then public: a version tag reaches the registry only once
# nothing before it can fail, and a public release always has its binaries
# there. A failed run is re-run from the tag, by re-running its jobs or by a
# dispatch from the tag; the rebuild replaces the draft's assets and the GHCR
# version tag. A published release is refused.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Per tag and never cancelled: a run stopped between a push and its signature
# leaves an artifact unsigned.
concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The default shell runs `bash -e` without pipefail.
defaults:
  run:
    shell: bash

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    # Covers the wait for the main lane, which can take most of an hour when
    # the tag follows the merge at once.
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      # The whole history and its tags, for the checks against main and for
      # git describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::run this from a tag, not the $TAG $REF_TYPE"
            exit 1
          fi
          # No `+` metadata: the version becomes a GHCR tag.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N tag"
            exit 1
          fi
          version=${TAG#v}

          # git describe prefers an annotated tag, so a lightweight one would
          # build as whatever annotated tag shares its commit.
          kind=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)
          if [ "$kind" != tag ]; then
            echo "::error::$TAG is a lightweight tag; tag with git tag -a"
            exit 1
          fi

          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points at $commit, which is not on main"
            exit 1
          fi

          # With two release tags on one commit (an rc and its final), a build
          # there reports the newer one.
          picked=$(git describe --tags --exact-match --match 'v[0-9]*' "$commit")
          if [ "$picked" != "$TAG" ]; then
            echo "::error::$commit also carries $picked, which a build there reports; release $picked"
            exit 1
          fi

          # A published release's assets are final. This token sees no drafts,
          # so a draft passes here.
          if published=$(gh release view "$TAG" --json isDraft \
              --jq '.isDraft | not' 2>"$RUNNER_TEMP/view.err"); then
            if [ "$published" = true ]; then
              echo "::error::the $TAG release is published already"
              exit 1
            fi
          elif ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::could not tell whether $TAG is released"
            exit 1
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      # Before the wait below, so a tag whose notes cannot be built fails at
      # once.
      - name: Build the release notes
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          tools/changelog.sh --notes "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || {
            echo "::error::the notes for $TAG came out empty"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

      # The main lane runs once per push and is never cancelled, so the head of
      # every push to main has a run. A tag pushed right after its merge usually
      # finds that run in progress, so this waits for it.
      - name: Require a passing main-lane run for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.check.outputs.commit }}
          WORKFLOW: main-build-and-publish.yml
        run: |
          deadline=$((SECONDS + 70 * 60))
          while :; do
            runs=$(gh run list --workflow "$WORKFLOW" --commit "$COMMIT" \
              --json databaseId,status,conclusion --limit 20)
            if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
              # The push event can lag the merge by a little.
              if [ $SECONDS -gt 300 ]; then
                echo "::error::no $WORKFLOW run exists for $COMMIT; a release tags the head of a push to main, not a commit inside one"
                exit 1
              fi
            elif jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' \
                <<<"$runs" >/dev/null; then
              id=$(jq -r 'map(select(.conclusion == "success"))[0].databaseId' <<<"$runs")
              echo "$WORKFLOW run $id passed for $COMMIT"
              break
            elif ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              jq -r '.[] | "run \(.databaseId): \(.status) \(.conclusion)"' <<<"$runs"
              echo "::error::no $WORKFLOW run passed for $COMMIT"
              exit 1
            fi
            if [ $SECONDS -gt $deadline ]; then
              echo "::error::gave up waiting for $WORKFLOW on $COMMIT"
              exit 1
            fi
            echo "waiting for $WORKFLOW on $COMMIT ..."
            sleep 60
          done

  build:
    name: Build binaries
    needs: check-tag
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    # No version is passed: each binary derives it at the tag, and verify
    # checks what it reports.
    with:
      developer-id: true
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

  verify:
    name: Verify the binaries
    needs: [check-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hvi-*
          path: ${{ runner.temp }}/artifacts

      - name: Check each manifest
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
          COMMIT: ${{ needs.check-tag.outputs.commit }}
        run: |
          for tarball in "$RUNNER_TEMP"/artifacts/hvi-*/*.tar; do
            target=$(basename "$tarball" .tar)
            manifest=$(tar -xOf "$tarball" binaries/manifest.json)
            built=$(jq -r '.version' <<<"$manifest")
            if [ "$built" != "$VERSION" ]; then
              echo "::error::$target reports $built, release is $VERSION"
              exit 1
            fi
            revision=$(jq -r '.revision' <<<"$manifest")
            if [ "$revision" != "$COMMIT" ]; then
              echo "::error::$target was built from $revision, not $COMMIT"
              exit 1
            fi
            case "$target" in
              *-apple-darwin)
                if [ "$(jq -r '.signed' <<<"$manifest")" != "true" ]; then
                  echo "::error::$target was not signed with the Developer ID"
                  exit 1
                fi
                ;;
            esac
            echo "$target: $built from $revision"
          done

  draft:
    name: Draft the release
    needs: [check-tag, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hvi-*
          path: ${{ runner.temp }}/artifacts

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Assemble the release archives
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          dist=$RUNNER_TEMP/release
          mkdir -p "$dist"
          for tarball in "$RUNNER_TEMP"/artifacts/hvi-*/*.tar; do
            target=$(basename "$tarball" .tar)
            work=$(mktemp -d)
            tar -C "$work" -xf "$tarball"
            tar -C "$work/binaries" -czf \
              "$dist/hvi-$VERSION-$target.tar.gz" hvi manifest.json
            rm -rf "$work"
          done

          (cd "$dist" && sha256sum -- *.tar.gz > SHA256SUMS)
          cat "$dist/SHA256SUMS"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # One signature over the checksums covers every archive.
      - name: Sign the checksums
        env:
          COSIGN_YES: "true"
        run: |
          cd "$RUNNER_TEMP/release"
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.cosign.bundle

      # A draft found here is one an earlier run left, and its assets are
      # replaced. A published one is refused here too: re-running the failed
      # jobs of a run skips check-tag.
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-tag.outputs.tag }}
          PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP/release"
          assets="hvi-*.tar.gz SHA256SUMS SHA256SUMS.cosign.bundle"
          # shellcheck disable=SC2086 # the asset list is several words
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft \
              2>"$RUNNER_TEMP/view.err"); then
            if [ "$draft" != true ]; then
              echo "::error::the $TAG release is published already"
              exit 1
            fi
            gh release upload "$TAG" --clobber $assets
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          elif ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::could not tell whether $TAG is released"
            exit 1
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --draft --verify-tag --prerelease \
              --title "hvi $TAG" --notes-file "$RUNNER_TEMP/notes.md" $assets
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "hvi $TAG" --notes-file "$RUNNER_TEMP/notes.md" $assets
          fi
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "- \(.name)"' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish binaries
    needs: [check-tag, verify, draft]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-binaries.yml
    with:
      version-tag: ${{ needs.check-tag.outputs.tag }}

  release:
    name: Publish the release
    needs: [check-tag, draft, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # From a draft only, so a re-run after it published changes nothing.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "the $TAG release is published already"
            exit 0
          fi
          gh release edit "$TAG" --draft=false
          echo "published hvi $TAG"
