name: Publish binaries

# Push the binaries the calling run built to GHCR and sign them, as
# <target>-<sha>, or as <target>-vX.Y.Z when the caller passes a version tag.
# Called only: by main-build-and-publish.yml once the suites pass, and by
# tag-release.yml after verify. It is a workflow of its own so that a pull
# request, which never calls it, holds no registry write permission.
#
# Both callers key their concurrency on the commit or the tag and never cancel,
# since a run stopped between the push and the signature leaves a tag unsigned.
# Re-running the caller signs it.

on:
  workflow_call:
    inputs:
      version-tag:
        description: >-
          The version to publish each artifact under (for example `v0.2.0`), in
          place of the commit. An existing version tag is replaced: the release
          refuses a published version, so one found here was left by a failed
          run. Empty publishes the commit tag.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The default shell runs `bash -e` without pipefail.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve the tags
        id: resolve-tags
        env:
          TARGET: ${{ matrix.target }}
          OWNER: ${{ github.repository_owner }}
          VERSION_TAG: ${{ inputs.version-tag }}
        run: |
          # The registry path is lowercase; the organization's name is not.
          repository="ghcr.io/${OWNER,,}/hvi-binaries"
          if [ -n "$VERSION_TAG" ]; then
            echo "refs=$repository:$TARGET-$VERSION_TAG" >> "$GITHUB_OUTPUT"
            echo "replace=true" >> "$GITHUB_OUTPUT"
          else
            echo "refs=$repository:$TARGET-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
          fi

      # A late re-run of the main lane can find the artifact expired and still
      # has a tag to sign. A release always has its artifact, so there a failed
      # download fails the job.
      - name: Download the binaries
        id: download
        continue-on-error: ${{ inputs.version-tag == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hvi-${{ matrix.target }}
          path: ${{ runner.temp }}/artifact

      - name: Push the binaries
        if: steps.download.outcome == 'success'
        env:
          TARGET: ${{ matrix.target }}
          REFS: ${{ steps.resolve-tags.outputs.refs }}
          REPLACE: ${{ steps.resolve-tags.outputs.replace }}
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/artifact/$TARGET.tar"
          for ref in $REFS; do
            if [ "$REPLACE" != true ] &&
                oras manifest fetch "$ref" >/dev/null 2>&1; then
              echo "$ref is already published"
              continue
            fi
            # One directory, since a file pushed on its own loses its mode.
            (cd "$RUNNER_TEMP" && oras push "$ref" \
              "binaries:application/vnd.brig-sh.hvi.binaries")
            echo "- \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Pinned, since the script reads cosign's status for an unsigned artifact.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Keyless. Takes the refs alone, so it also signs a tag an earlier
      # attempt pushed and left unsigned.
      - name: Sign the unsigned artifacts
        env:
          COSIGN_YES: "true"
          REFS: ${{ steps.resolve-tags.outputs.refs }}
        run: |
          # shellcheck disable=SC2086 # the refs are a space-separated list
          .github/scripts/sign-artifacts.sh $REFS
