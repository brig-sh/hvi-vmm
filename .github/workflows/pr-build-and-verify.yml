name: Build and verify

on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR (or ref for a manual dispatch).
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # It reads the commit range of a pull request. A manual dispatch has no
  # range, so the check would pass without reading a commit.
  validate-commits:
    name: Validate commits
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/validate-commits.yml

  validate-code:
    name: Validate code
    uses: ./.github/workflows/validate-code.yml

  build-and-test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yml

  test-e2e:
    name: Test e2e
    uses: ./.github/workflows/test-e2e.yml
