name: Build and verify main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-code:
    name: Validate code
    uses: ./.github/workflows/validate-code.yml

  build-and-test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yml
    # A called workflow gets none of the caller's secrets unless told, and the
    # coverage upload in it reads CODECOV_TOKEN. Without this the upload runs
    # tokenless, never fails, and the badge stays at "unknown" with nothing in
    # the log to say why.
    secrets: inherit
