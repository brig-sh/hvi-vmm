# Spell-check configuration for crate-ci/typos, covering both the tree and the
# commit messages of a pull request (see validate-commits.yml).

# Domain terms and identifiers that are not misspellings.
[default.extend-words]
# PL011 register names: MIS is the masked interrupt status register.
mis = "mis"
# 16550 register names: THR is the transmit holding register, THRE the
# "transmit holding register empty" bit in LSR.
thr = "thr"
thre = "thre"
# Plural of VA, a virtual address.
vas = "vas"
# The C field name in struct msghdr is msg_controllen.
controllen = "controllen"
# "FTER" is the event rings' magic, the four bytes a reader validates the ring
# header with, the way "FTCB" heads the control block.
fter = "fter"
# O_WRONLY, the Linux open(2) access mode the virtio-fs backend translates.
wronly = "wronly"
# SME, the Arm Scalable Matrix Extension, whose state a checkpoint refuses.
sme = "sme"
# mke2fs, the e2fsprogs tool that makes the ext4 disk the checkpoint e2e uses.
mke = "mke"
