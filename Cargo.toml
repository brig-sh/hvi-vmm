[package]
name = "hvi"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The microVMM that runs brig's sandboxes -- Hypervisor.framework (macOS) and KVM (Linux) backends"
license = "Apache-2.0"
repository = "https://github.com/brig-sh/hvi-vmm"

# The backend is chosen by target:
#   macOS + aarch64  -> Apple Hypervisor.framework (applevisor)
#   Linux + aarch64  -> KVM (kvm-ioctls / kvm-bindings), arm64 guest
#   Linux + x86_64   -> KVM (kvm-ioctls / kvm-bindings), x86-64 guest
# On any other target the build stops with a compile error.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kernel virtio headers as bindgen output: feature bits, device ids, the mmio
# register map and the net header layout. Every backend needs them.
virtio-bindings = "0.2.7"
# Guest RAM as a region collection, the type the rust-vmm crates take as guest
# memory. `backend-mmap` maps each region from the shareable object that
# `memory::SharedRam` allocates.
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
# Kernel image loaders and boot configurators over that memory: the arm64
# `Image` loader with the devicetree configurator, and the x86 `bzImage`
# loader with the Linux boot-protocol configurator. The crate gates each
# loader on the target architecture itself.
linux-loader = { version = "0.14.0", features = ["bzimage"] }
# Raw syscalls the backends share: memfd/shm guest RAM, rlimits, mmap, and the
# tap and block-device ioctls. The version floor matters: `_IOR`/`_IOW` became
# public in 0.2.172 and return `Ioctl` from 0.2.173; `Ioctl` and the TUN
# request constants predate both.
libc = "0.2.189"
# The 16550 register file, maintained upstream. Only the x86 backend has a
# COM1; pl011 (arm64) and the MC146818 CMOS have no equivalent in the crate,
# so those stay ours. The legacy devices build for every backend, whichever
# guest uses them, so this is a common dependency.
vm-superio = "0.8.1"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Pure-Rust devicetree builder for the arm64 guest's devicetree
# (`arch::aarch64::fdt`).
vm-fdt = "0.3.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
applevisor = "1.0.0"
# Raw Hypervisor.framework entry points. Needed for hv_vm_map on a host pointer
# we allocated ourselves (shared guest RAM); applevisor only maps its own.
applevisor-sys = "1.0.0"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
# seccomp-bpf allowlists for the Linux backends. The rust-vmm crate extracted
# from Firecracker: it owns the syscall tables and the BPF codegen, so
# `resources/seccomp/*.json` is all we write. The `json` feature pulls
# serde/serde_json, which this crate already depends on.
seccompiler = { version = "0.5", features = ["json"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
kvm-ioctls = "0.25"
# fam-wrappers gives the CpuId FAM wrapper for KVM_GET_SUPPORTED_CPUID / SET_CPUID2.
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
# See the aarch64 section above.
seccompiler = { version = "0.5", features = ["json"] }

# virtio-fs on Linux is served out of process by virtiofsd, so what the VMM
# needs is the frontend half of vhost-user: the handshake, the memory table and
# the vring messages. The rust-vmm crate owns that protocol, which is the same
# one cloud-hypervisor and QEMU speak, so the device in `devices::virtio::fs::vhost_user` is a
# virtio-mmio transport and nothing else.
[target.'cfg(target_os = "linux")'.dependencies]
vhost = { version = "0.17.0", features = ["vhost-user-frontend"] }
# EventFd, the type `vhost` takes for the kick and call descriptors.
vmm-sys-util = "0.15"

# The VMM as a library, so it can be linked as well as run.
[lib]
name = "hvi"
path = "src/lib.rs"

[[bin]]
name = "hvi"
path = "src/main.rs"

[profile.release]
debug = true
