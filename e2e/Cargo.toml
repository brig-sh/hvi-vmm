# The end-to-end suite: tests that boot real guests under the `hvi` binary and
# check what it does from outside the process. It is a workspace of its own,
# with its own lockfile, so its dependencies never reach hvi's.
#
# The guest agent is a member but not a default member, so a plain `cargo`
# command here never builds it for the host.
[package]
name = "hvi-e2e"
version = "0.1.0"
description = "End-to-end tests that boot real guests under the hvi binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1.10"
hvi-e2e-protocol.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"

# The tests hash large guest files, which is slow with an unoptimized sha2.
[profile.dev.package.sha2]
opt-level = 3

[workspace]
members = ["protocol", "guest/agent"]
default-members = [".", "protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
hvi-e2e-protocol = { path = "protocol", version = "0.1.0" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
