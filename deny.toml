# Configuration for cargo-deny, for the crate's lockfile and for the e2e suite's
# in e2e/. `cargo deny check` audits both for RUSTSEC advisories, licenses,
# duplicate versions and registry sources. Both are checked against this one
# file, so an exception added for the suite relaxes the crate's audit too.
#
# The crate's graph holds 21 external crates, and several are inside the trusted
# computing base: applevisor, kvm-ioctls, seccompiler and libc. A change to this
# file is therefore a change to what that base can contain.

[graph]
# Audit the dependencies of every feature, not of the default set alone.
# The crate declares no features today, so this changes nothing now. It
# keeps the first feature that gates a dependency from dropping that
# dependency out of the audited graph.
all-features = true

[advisories]
version = 2
# The author of a yanked crate withdrew it. Report that, do not record it
# as a footnote.
yanked = "deny"
# Each entry must name the advisory and say why it does not apply here. An
# entry with no reason does not pass review.
ignore = []

[licenses]
version = 2
# The list holds what the crate and the e2e suite need, and nothing more. Only
# the crate's dependencies carry BSD-3-Clause, so the e2e audit warns that it
# goes unused there. Add a license when a dependency carries it, not before.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
# An update can pull in a second version of a crate the tree already holds.
# Report a duplicate instead of failing on it: the warning shows it in the log,
# and a choice of versions made inside a dependency does not block the update.
multiple-versions = "warn"
# A dependency without a version requirement is refused, since one from a
# registry would then float to whatever was published last.
wildcards = "deny"
# Except a path dependency on a crate of this workspace that is never
# published: `build-version` carries no version to require, and the path says
# exactly which code is built. Requiring one would put the same number in two
# places for cargo to compare with itself.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
